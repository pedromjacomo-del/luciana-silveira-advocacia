    -webkit-text-size-adjust: 100%;

    background-color: var(--color-ink);

    -moz-osx-font-smoothing: grayscale;

  }
  ::selection {
    background: var(--color-gold-400);
    color: var(--color-ink);
  }
  :focus-visible {
    outline: 2px solid var(--color-gold-300);
    outline-offset: 3px;
  }
}
@layer components {

    background-clip: text;

    background-clip: text;
    color: transparent;
  }

  }

    transform: translateX(-120%);
    transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .btn-gold:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
    box-shadow: 0 1px 0 rgba(255, 245, 215, 0.6) inset, 0 -1px 0 rgba(90, 60, 20, 0.45) inset, 0 18px 40px -14px rgba(226, 185, 105, 0.75);
  }

  .btn-outline-gold:hover {

  }
  .paper {
    background-color: var(--color-sand);

  }
  .paper::before {
    content: "";

    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .38  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .grain::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.08;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
}
.reveal {
  opacity: 0;
  transform: translate3d(0, 28px, 0);
  transition: opacity 1s cubic-bezier(0.2, 0.7, 0.2, 1), transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);
  will-change: opacity, transform;
}
.reveal[data-from="left"] {
  transform: translate3d(-36px, 0, 0);
}
.reveal[data-from="right"] {
  transform: translate3d(36px, 0, 0);
}
.reveal[data-from="fade"] {
  transform: none;
}
.reveal.is-visible {
  opacity: 1;
  transform: none;
}
@keyframes float-leaf {
  0%, 100% {
    transform: translate3d(0, 0, 0) rotate(var(--r, 0deg));
  }
  50% {
    transform: translate3d(0, -10px, 0) rotate(calc(var(--r, 0deg) + 6deg));
  }
}
.float-leaf {
  animation: float-leaf var(--d, 7s) ease-in-out infinite;
  transform: rotate(var(--r, 0deg));
}
@keyframes beam-sway {
  0%, 100% {
    transform: rotate(-2.2deg);
  }
  50% {
    transform: rotate(2.2deg);
  }
}
@keyframes pan-counter {
  0%, 100% {
    transform: rotate(2.2deg);
  }
  50% {
    transform: rotate(-2.2deg);
  }
}
.scale-beam, .scale-pan {
  transform-box: view-box;
}
.scale-beam {
  animation: beam-sway 9s ease-in-out infinite;
}
.scale-pan {
  animation: pan-counter 9s ease-in-out infinite;
}
@keyframes glow-pulse {
  0%, 100% {
    opacity: 0.55;
  }
  50% {
    opacity: 0.8;
  }
}
.glow-pulse {
  animation: glow-pulse 6s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }
  .float-leaf, .scale-beam, .scale-pan, .glow-pulse {
    animation: none;
  }
}
