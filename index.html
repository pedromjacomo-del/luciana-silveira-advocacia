@layer base {

    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }
  body {
    background-color: var(--color-ink);

    -moz-osx-font-smoothing: grayscale;

  }
  ::selection {
    background: var(--color-gold-400);
    color: var(--color-ink);
  }
  :focus-visible {
    outline: 2px solid var(--color-gold-300);
    outline-offset: 3px;
  }
}
@layer components {

    background-clip: text;
    color: transparent;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .text-silver {

    background-clip: text;
    color: transparent;
  }
  .text-gold-deep {
    background-image: linear-gradient( 175deg, #c9a25a 0%, #a87b34 35%, #7b5520 60%, #b48a45 85%, #8a6127 100% );

    background-clip: text;
    color: transparent;
  }

    color: #1c140a;
    box-shadow: 0 1px 0 rgba(255, 245, 215, 0.6) inset, 0 -1px 0 rgba(90, 60, 20, 0.45) inset, 0 12px 30px -12px rgba(214, 170, 90, 0.55);

  }
  .btn-gold::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient( 110deg, transparent 30%, rgba(255, 250, 230, 0.55) 50%, transparent 70% );
    transform: translateX(-120%);
    transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .btn-gold:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
    box-shadow: 0 1px 0 rgba(255, 245, 215, 0.6) inset, 0 -1px 0 rgba(90, 60, 20, 0.45) inset, 0 18px 40px -14px rgba(226, 185, 105, 0.75);
  }
  .btn-gold:hover::after {
    transform: translateX(120%);
  }
  .btn-outline-gold {
    border: 1px solid rgba(227, 194, 124, 0.55);
    color: var(--color-gold-200);
    transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease;
  }
  .btn-outline-gold:hover {
    background-color: rgba(227, 194, 124, 0.1);
    border-color: var(--color-gold-300);
    color: var(--color-gold-100);
  }
  .gold-rule {
    height: 1px;
    background: linear-gradient( 90deg, transparent 0%, rgba(185, 138, 60, 0.35) 12%, #e3c27c 50%, rgba(185, 138, 60, 0.35) 88%, transparent 100% );
  }
  .paper {
    background-color: var(--color-sand);
    background-image: radial-gradient( 120% 90% at 70% 40%, rgba(255, 252, 245, 0.85) 0%, rgba(255, 252, 245, 0) 60% ), linear-gradient(135deg, #efe9de 0%, #e4dccd 55%, #d6cab4 100%);
  }
  .paper::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .38  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .grain::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.08;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
}
.reveal {
  opacity: 0;
  transform: translate3d(0, 28px, 0);
  transition: opacity 1s cubic-bezier(0.2, 0.7, 0.2, 1), transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);
  will-change: opacity, transform;
}
.reveal[data-from="left"] {
  transform: translate3d(-36px, 0, 0);
}
.reveal[data-from="right"] {
  transform: translate3d(36px, 0, 0);
}
.reveal[data-from="fade"] {
  transform: none;
}
.reveal.is-visible {
  opacity: 1;
  transform: none;
}
@keyframes float-leaf {
  0%, 100% {
    transform: translate3d(0, 0, 0) rotate(var(--r, 0deg));
  }
  50% {
    transform: translate3d(0, -10px, 0) rotate(calc(var(--r, 0deg) + 6deg));
  }
}
.float-leaf {
  animation: float-leaf var(--d, 7s) ease-in-out infinite;
  transform: rotate(var(--r, 0deg));
}
@keyframes sand-fall {
  0% {
    stroke-dashoffset: 0;
  }
  100% {
    stroke-dashoffset: -24;
  }
}
.sand-stream {
  stroke-dasharray: 3 3;
  animation: sand-fall 1.2s linear infinite;
}
@keyframes glow-pulse {
  0%, 100% {
    opacity: 0.55;
  }
  50% {
    opacity: 0.8;
  }
}
.glow-pulse {
  animation: glow-pulse 6s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }
  .float-leaf, .sand-stream, .glow-pulse {
    animation: none;
  }
}
